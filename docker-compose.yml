services:
  # PostgreSQL Database
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    restart: 'no'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dev_database}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    volumes:
      - './data/postgres:/var/lib/postgresql'
      - './configs/postgres/init:/docker-entrypoint-initdb.d'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    command: postgres -c max_locks_per_transaction=2000
    networks:
      - development_environment
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dev_database}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # pgAdmin4 para PostgreSQL
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:7.8
    restart: 'no'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - './data/pgadmin:/var/lib/pgadmin'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - development_environment

  # MySQL Database
  mysql:
    container_name: mysql
    image: mysql:8.0.34
    restart: 'no'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dev_database}
      MYSQL_USER: ${MYSQL_USER:-mysql_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - './data/mysql:/var/lib/mysql'
      - './configs/mysql/init:/docker-entrypoint-initdb.d'
      - './configs/mysql/conf.d:/etc/mysql/conf.d'
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${MYSQL_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - development_environment

  # MariaDB Database
  mariadb:
    container_name: mariadb
    image: mariadb:10.11.5
    restart: 'no'
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-dev_database}
      MYSQL_USER: ${MARIADB_USER:-mariadb_user}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - './data/mariadb:/var/lib/mysql'
      - './configs/mariadb/init:/docker-entrypoint-initdb.d'
    ports:
      - '${MARIADB_PORT:-3307}:3306'
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${MARIADB_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - development_environment

  # Redis Cache
  redis:
    container_name: redis
    image: redis:7.2.1-alpine
    restart: 'no'
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - './data/redis:/data'
      - './configs/redis/redis.conf:/usr/local/etc/redis/redis.conf'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - development_environment

  # RedisInsight - Interface Web para Redis
  redisinsight:
    container_name: redisinsight
    image: redis/redisinsight:2.54
    restart: 'no'
    user: '1000:1000'
    environment:
      REDIS_HOSTS: 'local:redis:6379:${REDIS_PASSWORD}'
    volumes:
      - './data/redisinsight:/data'
    ports:
      - '${REDISINSIGHT_PORT:-5540}:5540'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - development_environment

  # MongoDB Database
  mongodb:
    container_name: mongodb
    image: mongo:7.0.2
    restart: 'no'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-dev_database}
    volumes:
      - './data/mongodb:/data/db'
      - './configs/mongodb/init:/docker-entrypoint-initdb.d'
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    command: >
      mongod
      --auth
      --bind_ip_all
      --logpath /var/log/mongodb/mongod.log
      --logappend
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - development_environment

  # MongoDB Express - Interface Web para MongoDB
  mongo-express:
    container_name: mongo_express
    image: mongo-express:latest
    restart: 'no'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_ROOT_USER:-admin}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - '${MONGO_EXPRESS_PORT:-8081}:8081'
    networks:
      - development_environment

  # Firebird Database
  firebird:
    container_name: firebird
    image: jacobalberty/firebird:3.0.10
    restart: 'no'
    environment:
      ISC_PASSWORD: ${FIREBIRD_PASSWORD}
      FIREBIRD_PASSWORD: ${FIREBIRD_PASSWORD}
      EnableLegacyClientAuth: 'true'
      EnableWireCrypt: 'false'
    volumes:
      - './data/firebird:/firebird/data'
    ports:
      - '${FIREBIRD_PORT:-3050}:3050'
    networks:
      - development_environment

  # Adminer - Interface Web para bancos SQL
  adminer:
    container_name: adminer
    image: adminer:4.8.1
    restart: 'no'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    networks:
      - development_environment

networks:
  development_environment:
    external: true

volumes:
  postgres_data:
  mysql_data:
  mariadb_data:
  mongodb_data:
  redis_data:
  firebird_data:
